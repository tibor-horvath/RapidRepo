version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # One PR per family instead of one per package and project: every PR runs the
    # full CI set. Minor/patch only, so a major still arrives alone for review.
    groups:
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*"]
        update-types: ["minor", "patch"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
        update-types: ["minor", "patch"]
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "FluentAssertions"
          - "Moq"
        update-types: ["minor", "patch"]
    ignore:
      # The Roslyn version RapidRepo.SourceGenerators references is our minimum supported
      # consumer SDK, not a dependency to keep current. Bumping it makes the generator
      # unloadable on older compilers (CS9057), which surfaces in consumers as unrelated
      # CS0246 errors. See the comment in RapidRepo.SourceGenerators.csproj.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Relational"
        update-types: ["version-update:semver-major"]
      # Test-only EF Core providers follow the test projects' target framework (net11.0):
      # EF Core 12 needs net12.0, so a major bump would only produce a failing PR.
      - dependency-name: "Microsoft.EntityFrameworkCore.InMemory"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
      timezone: "Europe/Budapest"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Every ci-toolkit workflow/action is released together; bumping them one
      # file at a time leaves the repo on mixed versions (and 5+ PRs per release).
      ci-toolkit:
        patterns: ["tibor-horvath/ci-toolkit*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["tibor-horvath/ci-toolkit*"]
        update-types: ["minor", "patch"]
