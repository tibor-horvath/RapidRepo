name: PR Labels

on:
  # Reads only the changed-file list and .github/labeler.yml from the base branch;
  # no PR code is checked out.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push or title edit supersedes the older run for the same PR. The event
# name keeps pull_request and pull_request_target runs in separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  path-labels:
    name: Path labels
    uses: tibor-horvath/ci-toolkit/.github/workflows/pr-path-labels.yml@c97cf48f4e459a501fcb6a1f49d6d9216cd69a0b # v2.1.1
    with:
      sync-labels: true
    permissions:
      contents: read
      pull-requests: write
