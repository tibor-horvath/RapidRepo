name: PR Labels

on:
  # Reads only the changed-file list and .github/labeler.yml from the base branch;
  # no PR code is checked out.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  path-labels:
    name: Path labels
    uses: tibor-horvath/ci-toolkit/.github/workflows/pr-path-labels.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    with:
      sync-labels: true
    permissions:
      contents: read
      pull-requests: write
