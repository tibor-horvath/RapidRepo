name: Publish NuGet Package

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  publish:
    # Trusted Publishing: the nuget.org policy must name this file (publish-nuget.yml).
    # ci-toolkit's nuget-publish composite action, not its reusable workflow: nuget.org
    # requires the OIDC `job_workflow_ref` claim to start with
    # tibor-horvath/RapidRepo/.github/workflows/, which only holds when the login runs
    # as a step in this repo's own job.
    name: NuGet Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for NuGet/login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Version defaults to the release tag (leading 'v' stripped);
      # test projects are IsPackable=false, so only the libraries publish.
      - name: Pack + push to NuGet
        uses: tibor-horvath/ci-toolkit/.github/actions/nuget-publish@54ff4a24736e4396941207135f82d0200c8c8746 # main (#66), pre-v2.1.0
        with:
          dotnet-version: "11.0.x"
          nuget-user: ${{ vars.NUGET_USER }}
