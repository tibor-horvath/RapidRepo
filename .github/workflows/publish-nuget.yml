name: Publish NuGet Package

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  publish:
    uses: tibor-horvath/ci-toolkit/.github/workflows/nuget-publish.yml@d9c2eac3bfc76a720ed60c343d7432430a3a8c0b # v1.15.0
    with:
      dotnet-version: "11.0.x"
      # version defaults to the release tag (leading 'v' stripped);
      # test projects are IsPackable=false, so only the libraries publish.
    secrets:
      nuget-api-key: ${{ secrets.NUGET_API_KEY }}
