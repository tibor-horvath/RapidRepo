name: Publish NuGet Package

on:
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  publish:
    # Trusted Publishing: nuget.org policy must name this file (publish-nuget.yml).
    permissions:
      contents: read
      id-token: write
    uses: tibor-horvath/ci-toolkit/.github/workflows/nuget-publish.yml@15f9c94b53247360a8c65b0228eec780d2ad81d5 # v2.0.0
    with:
      dotnet-version: "11.0.x"
      nuget-user: ${{ vars.NUGET_USER }}
      # version defaults to the release tag (leading 'v' stripped);
      # test projects are IsPackable=false, so only the libraries publish.
