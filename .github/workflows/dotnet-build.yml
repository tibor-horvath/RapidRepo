name: Build

on:
  push:
    branches:
      - master
      - beta
      - pre-release
  pull_request:
    branches:
      - master
      - beta
      - pre-release
    # Skipped only when every changed file matches. Pushes are never filtered:
    # Release waits on a Build run for every master push.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
      - ".github/labeler.yml"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

permissions:
  contents: read

# PR runs only: a newer push supersedes the older run. Any other event gets a
# unique group (run_id), so a push or scheduled run is never cancelled or dropped
# from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build & Test
    uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-build-test.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    with:
      dotnet-version: "11.0.x"
      runsettings: "coverlet.runsettings"
    secrets: inherit
    permissions:
      checks: write
      contents: read

  secrets:
    name: Secret scan
    uses: tibor-horvath/ci-toolkit/.github/workflows/secret-scan.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    permissions:
      contents: read

  coverage-comment:
    name: Coverage PR Comment
    needs: ci
    if: github.event_name == 'pull_request'
    uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-coverage-comment.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    with:
      dotnet-version: "11.0.x"
      thresholds: "60 80"
    permissions:
      contents: read
      pull-requests: write
