name: Security

on:
  push:
    branches:
      - master
      - beta
      - pre-release
  pull_request:
    branches:
      - master
      - beta
      - pre-release
    # Only what can change the package graph. New advisories against unchanged
    # packages are caught by the push and weekly runs.
    paths:
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
      - "**/packages.lock.json"
      - "global.json"
      - "nuget.config"
      - "NuGet.config"
      - ".github/workflows/security.yml"
  schedule:
    # New advisories and query-pack updates appear without any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# PR runs only: a newer push supersedes the older run. Any other event gets a
# unique group (run_id), so a push or scheduled run is never cancelled or dropped
# from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerable-packages:
    name: Vulnerable packages
    uses: tibor-horvath/ci-toolkit/.github/workflows/dotnet-vulnerable-packages.yml@c97cf48f4e459a501fcb6a1f49d6d9216cd69a0b # v2.1.1
    with:
      dotnet-version: "11.0.x"
      project: "RapidRepo.sln"
      include-transitive: true
      fail-on-findings: true
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    uses: tibor-horvath/ci-toolkit/.github/workflows/dependency-review.yml@c97cf48f4e459a501fcb6a1f49d6d9216cd69a0b # v2.1.1
    permissions:
      contents: read
      pull-requests: write
