name: PR Lint

on:
  # Reads only the PR title and changed-file list; no PR code is checked out.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

# A newer push or title edit supersedes the older run for the same PR. The event
# name keeps pull_request and pull_request_target runs in separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request_target'
    uses: tibor-horvath/ci-toolkit/.github/workflows/pr-title-lint.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    permissions:
      pull-requests: read

  # A `!` in the title makes the next release a major version, so the release
  # must ship with upgrade notes. Reads the title and the changed-file list
  # through the API; no PR code is checked out or run.
  migration-note:
    name: Migration note
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Breaking changes need a migration note
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            echo "Not a breaking change (no '!' in the title); nothing to check."
            exit 0
          fi
          if gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' | grep -q '^docs/migration/'; then
            echo "Breaking change with a migration note under docs/migration/."
            exit 0
          fi
          echo "::error title=Missing migration note::The PR title marks a breaking change ('!'), but nothing under docs/migration/ changed. Add upgrade notes for it there."
          exit 1

  workflows:
    name: Workflow lint
    if: github.event_name == 'pull_request'
    uses: tibor-horvath/ci-toolkit/.github/workflows/workflow-lint.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    with:
      # 1.7.8+ knows the `models` permission used by issue-triage.yml;
      # the toolkit's default (1.7.7) rejects it.
      actionlint-version: "1.7.12"
    permissions:
      contents: read
