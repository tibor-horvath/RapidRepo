name: PR Lint

on:
  # Reads only the PR title from the event payload; no PR code is checked out.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

# A newer push or title edit supersedes the older run for the same PR. The event
# name keeps pull_request and pull_request_target runs in separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request_target'
    uses: tibor-horvath/ci-toolkit/.github/workflows/pr-title-lint.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    permissions:
      pull-requests: read

  workflows:
    name: Workflow lint
    if: github.event_name == 'pull_request'
    uses: tibor-horvath/ci-toolkit/.github/workflows/workflow-lint.yml@11a36a951031ecef7f20f3e1206014dd2c5ddac8 # v2.1.0
    with:
      # 1.7.8+ knows the `models` permission used by issue-triage.yml;
      # the toolkit's default (1.7.7) rejects it.
      actionlint-version: "1.7.12"
    permissions:
      contents: read
