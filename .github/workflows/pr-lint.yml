name: PR Lint

on:
  # Reads only the PR title from the event payload; no PR code is checked out.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request_target'
    uses: tibor-horvath/ci-toolkit/.github/workflows/pr-title-lint.yml@d9c2eac3bfc76a720ed60c343d7432430a3a8c0b # v1.15.0
    permissions:
      pull-requests: read

  workflows:
    name: Workflow lint
    if: github.event_name == 'pull_request'
    uses: tibor-horvath/ci-toolkit/.github/workflows/workflow-lint.yml@d9c2eac3bfc76a720ed60c343d7432430a3a8c0b # v1.15.0
    permissions:
      contents: read
