name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge
    # Approves and auto-merges patch and minor bumps (all ecosystems, grouped PRs only
    # when every member qualifies). Majors are left for review; CODEOWNERS requests it.
    uses: tibor-horvath/ci-toolkit/.github/workflows/dependabot-automerge.yml@c97cf48f4e459a501fcb6a1f49d6d9216cd69a0b # v2.1.1
    permissions:
      contents: write
      pull-requests: write
